name: بناء تطبيق أندرويد (Captain Party)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: بناء APK
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تثبيت Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: تثبيت الحزم (pub get)
        run: flutter pub get

      - name: بناء APK (نسخة الإصدار)
        run: flutter build apk --release

      - name: رفع الـ APK كملف قابل للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: captain-party-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
